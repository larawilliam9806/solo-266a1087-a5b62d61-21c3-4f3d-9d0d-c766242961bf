services:
  demux:
    build: .
    image: fastq-demux:latest
    container_name: fastq-demux
    ports:
      - "8000:8000"
    environment:
      DEMUX_DATA_DIR: /data
    volumes:
      - demux-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  demux-data:
