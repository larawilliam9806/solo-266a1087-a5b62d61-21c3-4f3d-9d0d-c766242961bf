services:
  demux:
    build: .
    image: fastq-demux:latest
    container_name: fastq-demux
    ports:
      - "8000:8000"
    environment:
      DEMUX_DATA_DIR: /data
      # Multiple worker processes share the data volume; processing leases
      # (heartbeat columns) keep each worker's recovery from touching another
      # worker's in-flight corrections.
      DEMUX_UVICORN_WORKERS: ${DEMUX_UVICORN_WORKERS:-1}
      DEMUX_HEARTBEAT_SECONDS: ${DEMUX_HEARTBEAT_SECONDS:-2}
      DEMUX_LEASE_TIMEOUT_SECONDS: ${DEMUX_LEASE_TIMEOUT_SECONDS:-30}
    command:
      - sh
      - -c
      - "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${DEMUX_UVICORN_WORKERS}"
    volumes:
      - demux-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  demux-data:
